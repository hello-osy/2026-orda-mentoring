environment:
  ros_setup: /opt/ros/jazzy/setup.bash
  ros_domain_id: 29
  gz_partition: orda_mentoring
  software_rendering: true
  pip_packages:
  - numpy==1.26.4
  - opencv-python==4.11.0.86
  - ultralytics==8.3.228
  - PyYAML>=6.0,<7
  gazebo_config_paths:
  - /usr/share/gz
  egl_software_only: true
  cpu_threads: 2
  apt_packages:
  - python3-venv
  - build-essential
  - libegl-dev
  - ros-jazzy-ros-gz-bridge
  - ros-jazzy-cv-bridge
  - gz-harmonic
  - python3-yaml
  - libgl1-mesa-dri
  - libglx-mesa0
  - libegl-mesa0
  - libglib2.0-0t64
  - libxcb-xinerama0
  - libxcb-cursor0
  - libxcb-xinput0
  - libxkbcommon-x11-0
  torch_packages:
  - torch==2.6.0
  - torchvision==0.21.0
  torch_index: https://download.pytorch.org/whl/cpu
  gazebo_repository:
    package: gz-harmonic
    key_url: https://packages.osrfoundation.org/gazebo.gpg
    keyring: /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
    source_list: /etc/apt/sources.list.d/gazebo-stable.list
    url: https://packages.osrfoundation.org/gazebo/ubuntu-stable
    suite: noble
    components: main
    download_timeout: 30
simulator:
